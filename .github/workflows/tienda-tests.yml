name: Pruebas de la tienda

on:
  push:
    branches: [develop, main, 'mejora/**']
    paths: ['tienda/**', 'tests/**', '.github/workflows/tienda-tests.yml']
  pull_request:
    branches: [develop, main]
    paths: ['tienda/**', 'tests/**', '.github/workflows/tienda-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tienda-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: PHP ${{ matrix.php }} · MariaDB 11.4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # Credenciales públicas y desechables; solo existen durante este job.
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: tienda_perfumes_test
          MARIADB_USER: tienda_test_user
          MARIADB_PASSWORD: ci-app-only
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TIENDA_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=tienda_perfumes_test
      TIENDA_TEST_USER: root
      TIENDA_TEST_PASS: ci-root-only
      TIENDA_TEST_URL: http://127.0.0.1:8080
      TIENDA_TEST_ADMIN_PASS: ci-admin-only
      TIENDA_DB_HOST: 127.0.0.1
      TIENDA_DB_PORT: '3307'
      TIENDA_DB_NAME: tienda_perfumes_test
      TIENDA_DB_USER: tienda_test_user
      TIENDA_DB_PASS: ci-app-only
      TIENDA_ADMIN_PASS: ci-admin-only
      TIENDA_DEBUG: 'true'
      TIENDA_AUTH_SECRET: ci-only-authentication-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl
          coverage: none
      - name: Comprobar sintaxis
        run: find tienda tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Revisar archivos y patrones sensibles
        run: python3 tests/privacy.py
      - name: Preparar base desechable
        run: php tests/prepare_database.php --reset
      - name: Arrancar servidor con cuatro procesos
        run: |
          mkdir -p tests/sessions
          PHP_CLI_SERVER_WORKERS=4 php -d session.save_path="$PWD/tests/sessions" -d output_buffering=0 -d error_reporting=E_ALL -d log_errors=1 -S 127.0.0.1:8080 -t tienda > "$RUNNER_TEMP/tienda-php.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tienda-php.pid"
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/public/index.php > /dev/null; then exit 0; fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/tienda-php.log"
          exit 1
      - name: Regresiones HTTP
        run: php tests/integration.php
      - name: Privacidad y cuenta de cliente
        run: php tests/customer.php
      - name: Aislamiento y acceso administrativo
        run: php tests/admin.php
      - name: Catálogo y filtros
        run: php tests/catalog.php
      - name: Carrito y formulario de compra
        run: php tests/checkout.php
      - name: Compras simultáneas
        run: php tests/concurrency.php
      - name: Comprobar log PHP
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tienda-php.log" ]; then
            cat "$RUNNER_TEMP/tienda-php.log"
            if grep -E 'PHP (Warning|Fatal error|Parse error|Deprecated)|Uncaught' "$RUNNER_TEMP/tienda-php.log"; then exit 1; fi
          fi
      - name: Detener servidor
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tienda-php.pid" ]; then
            server_pid=$(cat "$RUNNER_TEMP/tienda-php.pid")
            pkill -TERM -P "$server_pid" || true
            kill "$server_pid" || true
          fi
